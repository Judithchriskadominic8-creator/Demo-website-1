<body background="OIP (5).JPG">

		<input style="padding: 10px 20px" type="text" name="UserName" required="required" placeholder="Enter the UserName">

	<p style="text-align: center;font-size: 20px;font-weight: bold;"><br>
		<label>Password </label>

<p style="text-align: center;font-size: 20px;font-weight: bold;"><br>
